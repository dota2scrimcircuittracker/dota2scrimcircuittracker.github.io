# Publish public/ to GitHub Pages on every push to main.
# public/firebase-config.js is generated here from the FIREBASE_WEB_API_KEY repository
# secret, so the key never sits in the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write Firebase config from secret
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node scripts/write-firebase-config.js
      # Link-preview pages (/heroic/week/ etc.), sitemap.xml and the trimmed division files
      # (data/<division>-lite.json) go into a copy, so public/ stays as committed.
      # 404.html is the app itself: GitHub Pages serves it for any other address (a player page,
      # an older week, a typo), and the app opens that route (lib/share.js routeOf).
      - name: Build site with link-preview pages
        run: cp -r public _site && node scripts/share-pages.js _site && node scripts/lite-data.js _site && cp _site/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # After a push deploys, post its commit subjects to the Discord updates channel
  # (scripts/discord-updates.cjs). Sync deploys come in as workflow_dispatch and are skipped.
  # No DISCORD_UPDATES_WEBHOOK secret → the script logs that and posts nothing.
  announce:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post to Discord
        env:
          DISCORD_UPDATES_WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/discord-updates.cjs
