# Publish public/ to GitHub Pages on every push to main, with the `staging` branch under
# /staging/ (Pages serves one site per repo, so each deploy builds both). A push to staging runs
# this from main through staging.yml: the Pages environment only deploys from main.
# Staging is read-only (public/lib/site.js) and runs on main's latest synced data.
# public/firebase-config.js is generated here from the FIREBASE_WEB_API_KEY repository
# secret, so the key never sits in the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The live site is always main, whichever branch was pushed.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write Firebase config from secret
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: node scripts/deploy/write-firebase-config.js
      # Link-preview pages (/heroic/week/ etc.), sitemap.xml and the trimmed division files
      # (data/<division>-lite.json) go into a copy, so public/ stays as committed.
      # 404.html is the app itself: GitHub Pages serves it for any other address (a player page,
      # an older week, a typo), and the app opens that route (lib/share.js routeOf).
      - name: Build site with link-preview pages
        run: cp -r public _site && node scripts/deploy/share-pages.js _site && node scripts/deploy/lite-data.js _site && cp _site/index.html _site/404.html
      # Staging: the staging branch's public/ under /staging/, with main's synced data copied
      # over its own (so it's as fresh as the live site; data files only staging writes are
      # kept). No preview pages: its addresses stay /staging/#/... . Skipped while there is no
      # staging branch.
      - name: Build staging
        run: |
          if ! git ls-remote --exit-code --heads origin staging >/dev/null; then echo "No staging branch."; exit 0; fi
          git fetch --depth=1 origin staging
          git worktree add ../staging-src FETCH_HEAD
          cp -r ../staging-src/public _site/staging
          cp -r public/data/. _site/staging/data/
          cp public/firebase-config.js _site/staging/
          sed -i 's|<base href="/">|<base href="/staging/"><meta name="robots" content="noindex">|' _site/staging/index.html
          grep -q '<base href="/staging/">' _site/staging/index.html
          node ../staging-src/scripts/deploy/lite-data.js _site/staging
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # After a push deploys, post its commit subjects to the Discord updates channel
  # (scripts/deploy/discord-updates.cjs). Sync deploys come in as workflow_dispatch and are skipped.
  # No DISCORD_UPDATES_WEBHOOK secret → the script logs that and posts nothing.
  announce:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post to Discord
        env:
          DISCORD_UPDATES_WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/deploy/discord-updates.cjs
