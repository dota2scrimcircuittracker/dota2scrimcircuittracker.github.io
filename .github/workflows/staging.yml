# A push to the staging branch redeploys the site from main, whose Pages workflow builds the
# live site and /staging/ together (pages.yml, "Build staging"). Pages only deploys from main,
# so staging never deploys itself.
name: Deploy staging

on:
  push:
    branches: [staging]

permissions:
  actions: write # start pages.yml on main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
