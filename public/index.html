<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Pages live at /warrior/players/ etc. too: resolve style.css, data/ and img/ from the root. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrim League</title>
  <meta name="description" content="Paste Dota 2 post-game screenshots; league standings, player and hero stats.">
  <meta name="theme-color" content="#0c0b0a">
  <!-- Link previews. Other pages get their own from scripts/share-pages.js at deploy. -->
  <meta property="og:site_name" content="Scrim League">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Scrim League">
  <meta property="og:description" content="Dota 2 scrim and AD2L stats: standings, weekly recaps, players, heroes and predictions.">
  <meta property="og:url" content="https://dota2scrimcircuittracker.github.io/">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800;900&family=Epilogue:wght@400;500;600;700&family=Martian+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Atmosphere: the river band and grain sit behind everything. -->
  <div class="river" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" id="home-link" href="#/" title="Home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
      <span class="brand-word" id="league-name">Scrim<b>League</b></span>
    </a>
    <nav id="nav"></nav>
    <div class="top-tools">
      <div class="search" id="search" role="search">
        <input id="search-in" type="search" placeholder="Find a player or team" autocomplete="off" spellcheck="false"
          aria-label="Find a player or team in any league" aria-controls="search-pop" aria-expanded="false" aria-autocomplete="list" role="combobox">
        <kbd class="search-key" aria-hidden="true">/</kbd>
        <div class="search-pop" id="search-pop" role="listbox" aria-label="Players and teams" hidden></div>
      </div>
      <div class="tm" id="tm" hidden>
        <button class="tm-btn" id="tm-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="tm-pop">All weeks</button>
        <div class="tm-pop" id="tm-pop" hidden></div>
      </div>
      <button class="tour-open" id="tour-open" type="button" title="A guided tour of the site">New here?</button>
      <button class="tour-open tour-restart" id="tour-restart" type="button" title="Start the tour from the beginning" hidden>Restart</button>
      <div class="switcher">
        <button class="league-btn" id="league-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="league-menu">League<span class="caret" aria-hidden="true"></span></button>
        <div class="league-menu" id="league-menu" hidden>
          <div class="menu-label">Switch league</div>
          <a href="#/" data-league="scrim"><b>Scrim League</b><span>Our scrims · uploaded screenshots</span></a>
          <a href="#/explorer/" data-league="explorer"><b>AD2L · S48 Explorer</b></a>
          <a href="#/voyager/" data-league="voyager"><b>AD2L · S48 Voyager</b></a>
          <a href="#/challenger/" data-league="challenger"><b>AD2L · S48 Challenger</b></a>
          <a href="#/warrior/" data-league="warrior"><b>AD2L · S48 Warrior</b></a>
          <a href="#/conqueror/" data-league="conqueror"><b>AD2L · S48 Conqueror</b></a>
          <a href="#/ad2l/" data-league="ad2l"><b>AD2L · S48 Champion</b></a>
          <a href="#/heroic/" data-league="heroic"><b>AD2L · S48 Heroic/Aegis</b></a>
        </div>
      </div>
    </div>
  </header>
  <div class="div-switch" id="div-switch" hidden></div>
  <main id="app"></main>
  <footer class="foot">
    <a href="#" id="tour-replay">Take the tour</a>
    <span>Not affiliated with Valve.</span>
  </footer>
  <datalist id="hero-list"></datalist>
  <datalist id="player-list"></datalist>
  <script type="module" src="app.js"></script>
</body>
</html>
